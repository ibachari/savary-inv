<style>
:root{--ink:#12211d;--ink-2:#3d4a45;--paper:#e6e8e1;--card:#fff;--line:#ccd1c6;--line-2:#e2e5dc;--accent:#0f6b57;--accent-soft:#d9ebe4;--signal:#b8690f;--signal-soft:#f7ecdc;--alert:#b3261e;--r:6px;--pad:16px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer}input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--pad)}
.head{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:10px;padding:9px var(--pad);max-width:860px;margin:0 auto;flex-wrap:wrap}
.mark{display:flex;flex-direction:column;gap:3px;padding-right:10px;border-right:1px solid var(--line)}
.mark img{height:15px;width:auto;display:block}
.mark span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-family:"IBM Plex Mono",monospace;font-size:14px;min-height:38px}
.who{margin-left:auto;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:99px;padding:6px 13px;min-height:38px;font-size:13px;font-weight:500}
.tabs{display:flex;max-width:860px;margin:0 auto;padding:0 var(--pad)}
.tabs a,.tabs button{flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink-2);border:0;background:none;border-bottom:2.5px solid transparent}
.tabs .on{color:var(--ink);border-bottom-color:var(--accent)}
.sync{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:6px var(--pad) 0;max-width:860px;margin:0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}.dot.ok{background:var(--accent)}.dot.wait{background:var(--signal)}.dot.err{background:var(--alert)}
h1{font-family:"Barlow Condensed",sans-serif;font-size:26px;margin:16px 0 4px}
.sub{color:var(--ink-2);margin:0 0 14px;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{aspect-ratio:1/1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center}
.tile b{font-family:"Barlow Condensed",sans-serif;font-size:23px;line-height:1.1;font-weight:700}
.tile small{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2)}
.tile.todo{border-style:dashed;border-color:var(--signal)}.tile.part{background:var(--accent-soft)}
.tile.full{background:var(--accent);border-color:var(--accent);color:#fff}.tile.full small{color:#d9ebe4}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.bar input[type=search]{flex:1 1 180px;min-height:42px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--card)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--r);padding:10px 14px;font-weight:600;min-height:42px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.p{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:12px 14px}
.p.done{border-left:5px solid var(--accent)}
.p.st-r{border-left:6px solid #c0392b}.p.st-o{border-left:6px solid #e67e22}.p.st-v{border-left:6px solid #2e8b57}
.stb{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff;margin-left:6px;vertical-align:middle}
.stb.r{background:#c0392b}.stb.o{background:#e67e22}.stb.v{background:#2e8b57}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:4px 0 8px}.p.low{border-left:5px solid var(--signal)}
.p-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.p-n{font-weight:600}.p-c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2)}
.p-tot{font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap}
.p-tot.zero{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.row label{flex:1;font-size:13px;color:var(--ink-2)}.row label em{display:block;font-style:normal;font-size:11.5px}
.row input[type=number]{width:96px;min-height:44px;font-size:18px;text-align:right;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-family:"IBM Plex Mono",monospace}
.row input.lt{width:130px;font-size:14px;text-align:left}
.mini{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.mini button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px}
.note{font-size:12px;color:var(--signal);margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}
th,td{border-bottom:1px solid var(--line-2);padding:6px 8px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono",monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;overflow-x:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.row .st{display:flex;gap:6px;align-items:center}
.stp{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);font-size:22px;font-weight:600;line-height:1}
.chipf{display:inline-block;color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:99px;margin-bottom:4px}
.grp{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;margin:18px 0 2px;padding-top:6px;border-top:2px solid var(--ink);display:flex;justify-content:space-between}
.grp small{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
select{min-height:42px;border:1px solid var(--line);border-radius:var(--r);padding:6px 28px 6px 10px;background:var(--card);font-size:14px;max-width:100%}
.sels{display:flex;gap:10px;flex-wrap:wrap}.sels label{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;flex:1 1 150px}.sels select{width:100%;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.hh{font-size:11.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;margin-top:3px}
.prog{position:sticky;top:var(--hh,112px);z-index:20;height:5px;background:var(--line-2)}.prog i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:10px;padding:16px;max-width:520px;width:calc(100% - 24px)}dialog::backdrop{background:rgba(18,33,29,.45)}
dialog input[type=text],dialog input[type=number]{min-height:42px;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:100%}
.fours{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.fours .ft{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px}.fours .fh{display:flex;justify-content:space-between;gap:8px;margin:8px 0 2px;font-size:14px}.fours .fh span{opacity:.75;font-size:13px}
.fours .vieux{opacity:.6}
.fx{display:grid;grid-template-columns:1fr 100px 40px;gap:6px;margin:6px 0}
[hidden]{display:none!important}
</style>
</head>

function recents(){ try { return JSON.parse(localStorage.getItem("ops") || "[]") || []; } catch (e) { return []; } }
function fixerQui(n){ S.who = n.trim(); save(); try { localStorage.setItem("op:" + S.date, S.who); const r = recents().filter(x => x !== S.who); localStorage.setItem("ops", JSON.stringify([S.who, ...r].slice(0, 12))); } catch (e) {} majWho(); }
$("#who").onclick = () => { const L = recents();
  if (!L.length){ const n = prompt("Votre prénom", S.who || ""); if (n) fixerQui(n); return; }
  let d = $("#dwho"); if (!d){ d = document.createElement("dialog"); d.id = "dwho"; document.body.appendChild(d); }
  d.innerHTML = `<h2 style="margin:0 0 8px">Qui compte ?</h2><div class="sels"><label>Prénom<select id="who-sel">${L.map(n => `<option ${n === S.who ? "selected" : ""}>${esc(n)}</option>`).join("")}<option value="">Autre prénom…</option></select></label></div><div class="bar"><button class="btn" id="who-ok">Valider</button><button class="btn ghost" id="who-no">Annuler</button></div>`;
  d.querySelector("#who-no").onclick = () => d.close();
  d.querySelector("#who-ok").onclick = () => { let n = d.querySelector("#who-sel").value; if (!n) n = prompt("Votre prénom", "") || ""; if (n) fixerQui(n); d.close(); };
  d.showModal(); };
const majWho = () => $("#who").textContent = S.who || "Qui compte ?";
$("#date").value = S.date;
$("#date").onchange = e => { S.date = e.target.value || today(); save(); pull(); rendre(); };

/* ---------- bilan et export ---------- */
function lignesBilan(){
  const par = {};
  for (const k in S.counts){ const x = cle(k); if (x.d !== S.date || x.z === "ATT" || !x.p || !compte(S.counts[k])) continue;
    const c = S.counts[k], r = par[x.id] = par[x.id] || {p: x.p, t: 0, zones: {}, lots: [], items: []};
    const sS = Object.values(c.s || {}).reduce((a, v) => a + (Number(v) || 0), 0); for (const kk in c.s || {}) if (c.s[kk] > 0) r.items.push([kk, Number(c.s[kk])]);
    const t = total(c, x.p); r.t += t; r.zones[x.z] = (r.zones[x.z] || 0) + t; if ((c.lot || c.dlc) && t - sS > 0) r.lots.push([c.lot || "", c.dlc || "", t - sS]); }
  return Object.values(par).sort((a, b) => a.p.n.localeCompare(b.p.n, "fr"));
}
let bz = "";
function bilan(){
  let L = lignesBilan(); if (bz) L = L.filter(r => r.zones[bz] != null); const nz = {};
  ZONES.forEach(z => nz[z.c] = avancement(z.c));
  $("#main").innerHTML = `<h1>Bilan du ${S.date.split("-").reverse().join("/")}</h1>
  <div class="card"><table><tr><th>Zone</th><th class="n">Comptés</th><th class="n">Prévus</th></tr>${ZONES.map(z => `<tr><td>${esc(z.n)}</td><td class="n">${nz[z.c][0]}</td><td class="n">${nz[z.c][1]}</td></tr>`).join("")}</table></div>
  ${Object.keys(S.rm).length ? `<div class="card"><b>À retirer de la fiche produit dans Hello Harel (${Object.values(S.rm).reduce((n, l) => n + l.length, 0)})</b>${Object.entries(S.rm).map(([id, l]) => l.map(x => `<div class="row"><label>${esc(PID[id]?.n)}<em>${esc(x.n)} · ${esc(x.m)}${x.t ? " · " + esc(x.t) : ""}</em></label></div>`).join("")).join("")}</div>` : ""}
  <div class="card"><div class="bar"><button class="btn" id="csv">Télécharger le CSV d'import Hello Harel</button><button class="btn ghost" id="csv2">Détail par zone (CSV)</button><button class="btn ghost" id="csv4">Conditionnements à retirer dans HH (CSV)</button><button class="btn ghost" id="csv3">Arrivages reçus à rentrer (CSV)</button></div>
  <p class="sub">Dans Hello Harel : Stock › Inventaires › créer l'inventaire, « Importer », choisir ce fichier. Les produits présents dans deux zones sont additionnés.</p></div>
  <div class="bar sels"><label>Zone<select id="sel-bz"><option value="">Toutes les zones</option>${opts(ZONES.map(z => [z.c, z.n]), bz)}</select></label></div>
  <div class="card"><table><tr><th>Produit</th><th class="n">Total</th><th>Par zone</th></tr>${L.map(r => `<tr><td>${esc(r.p.n)}</td><td class="n">${fmt(r.t)} ${UN[r.p.b]}</td><td>${Object.entries(r.zones).map(([z, t]) => `${z} ${fmt(t)}`).join(" · ")}</td></tr>`).join("") || `<tr><td colspan="3">Rien de compté à cette date.</td></tr>`}</table></div>`;
}
const champ = c => `"${String(c ?? "").replace(/"/g, '""')}"`;
function telecharger(nom, lignes){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + lignes.map(r => r.map(champ).join(",")).join("\r\n") + "\r\n"], {type: "text/csv;charset=utf-8"}));
  a.download = nom; a.click();
}
document.addEventListener("click", e => {
  if (e.target.id === "csv"){
    const ent = ["Product","Packaging","Location","Stock item","Supplier","Expected quantity (base unit)","Quantity (packaging)","Quantity (base unit)","Batch number","Expiration date","Unit price (base unit)","Last purchase price"];
    const out = [];
    lignesBilan().forEach(r => { const lots = r.lots.filter(l => l[0] || l[1]); const sIt = r.items.reduce((a, x) => a + x[1], 0), reste = r.t - sIt - lots.reduce((s, l) => s + l[2], 0);
      r.items.forEach(([kk, q]) => { const it = kk[0] === "i" ? IT[kk.slice(1)] : null, g = kk[0] === "f" ? groupesStock(r.p).find(z => z.nom === kk.slice(1)) : null, i0 = g?.items[0];
        out.push([r.p.c + " - " + r.p.n, r.p.pk, it ? it[4] : (i0 ? i0[4] : r.p.loc), it ? it[1] : "", it ? (it[3] ? it[3] + " - " : "") + it[2] : (i0 && i0[3] ? i0[3] + " - " : "") + kk.slice(1), it ? it[5] : (g ? g.tot : ""), q, q, it ? it[6] : "", it ? it[7] : "", "", ""]); });
      lots.forEach(l => out.push([r.p.c + " - " + r.p.n, r.p.pk, r.p.loc, "", "", "", l[2], l[2], l[0], l[1], "", ""]));
      if (reste > 1e-9 || (!lots.length && !r.items.length)) out.push([r.p.c + " - " + r.p.n, r.p.pk, r.p.loc, "", "", "", reste, reste, "", "", "", ""]); });
    telecharger("inventaire-MP-HH-" + S.date + ".csv", [ent, ...out]);
  } else if (e.target.id === "csv4"){
    const out = [["Code HH","Produit","Conditionnement","Problème","Précision","Signalé par","Date"]];
    for (const id in S.rm) for (const x of S.rm[id]) out.push([PID[id]?.c, PID[id]?.n, x.n, x.m, x.t || "", x.par || "", x.d || ""]);
    telecharger("conditionnements-a-retirer-HH-" + S.date + ".csv", out);
  } else if (e.target.id === "csv3"){
    const out = [["Date","Code","Produit","Fournisseur","Commande HH","Unité","Quantité commandée","Commandée le","Prévue le","Quantité reçue","Compté par"]];
    for (const k in S.counts){ const x = cle(k); if (x.d !== S.date || x.z !== "ATT" || !x.p) continue; const c = S.counts[k];
      for (const kk in c.s || {}){ if (!(c.s[kk] > 0)) continue; const a = PENDL(x.id).find(y => "p" + y[0] === kk); if (!a) continue;
        out.push([x.d, x.p.c, x.p.n, a[2], a[1], UN[x.p.b], a[4], a[6], a[5], c.s[kk], c.who || ""]); } }
    telecharger("arrivages-a-rentrer-" + S.date + ".csv", out);
  } else if (e.target.id === "csv2"){
    const out = [["Date","Zone","Code","Produit","Unité","Quantité","Lot","DLC","Compté par"]];
    for (const k in S.counts){ const x = cle(k); if (x.d !== S.date || x.z === "ATT" || !x.p || !compte(S.counts[k])) continue; const c = S.counts[k];
      out.push([x.d, ZONES.find(z => z.c === x.z)?.n, x.p.c, x.p.n, UN[x.p.b], total(c, x.p), c.lot || "", c.dlc || "", c.who || ""]); }
    telecharger("inventaire-MP-zones-" + S.date + ".csv", out);
  }
});

/* ---------- synchronisation (webhook n8n → table de données) ---------- */
const dot = (c, t) => { $("#dot").className = "dot " + c; $("#sync-t").textContent = t; };
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); }
async function appel(a, obj){
  const u = SYNC.url + "?token=" + encodeURIComponent(SYNC.token) + "&a=" + a + "&q=" + encodeURIComponent(JSON.stringify(obj));
  const r = await fetch(u, {redirect: "follow"}); if (!r.ok) throw new Error(r.status); return r.json();
}
async function envoyerFx(){
  if (!SYNC.url) return;
  for (const id of Object.keys(S.fxPending)){
    try { await appel("ecrire", {cle: "FX|" + id, date: "FX", zone: "FX", produit_id: Number(id), produit: PID[id]?.n, code: PID[id]?.c, formats: JSON.stringify(S.fx[id] || []), vrac: 0, total: 0, unite: "", lot: "", dlc: "", compte_par: S.who, maj: new Date().toISOString()});
      delete S.fxPending[id]; save(); } catch (e) { return dot("err", "hors ligne — conservé sur ce téléphone"); }
  }
}
async function envoyerRm(){
  if (!SYNC.url) return;
  for (const id of Object.keys(S.rmPending)){
    try { await appel("ecrire", {cle: "RM|" + id, date: "RM", zone: "RM", produit_id: Number(id), produit: PID[id]?.n, code: PID[id]?.c, formats: JSON.stringify({rm: S.rm[id] || []}), vrac: 0, total: 0, unite: "", lot: "", dlc: "", compte_par: S.who, maj: new Date().toISOString()});
      delete S.rmPending[id]; save(); } catch (e) { return dot("err", "hors ligne — conservé sur ce téléphone"); }
  }
}
async function envoyerNs(){
  if (!SYNC.url) return;
  for (const id of Object.keys(S.nsPending)){
    try { await appel("ecrire", {cle: "NS|" + id, date: "NS", zone: "NS", produit_id: Number(id), produit: PID[id]?.n, code: PID[id]?.c, formats: JSON.stringify({ns: S.ns[id] ?? 0}), vrac: 0, total: 0, unite: "", lot: "", dlc: "", compte_par: S.who, maj: new Date().toISOString()});
      delete S.nsPending[id]; save(); } catch (e) { return dot("err", "hors ligne — conservé sur ce téléphone"); }
  }
}
async function envoyerFo(){
  if (!SYNC.url) return;
  for (const id of Object.keys(S.foPending)){
    try { await appel("ecrire", {cle: "FO|" + id, date: "FO", zone: "FO", produit_id: Number(id), produit: PID[id]?.n, code: PID[id]?.c, formats: JSON.stringify({fo: S.fo[id] || ""}), vrac: 0, total: 0, unite: "", lot: "", dlc: "", compte_par: S.who, maj: new Date().toISOString()});
      delete S.foPending[id]; save(); } catch (e) { return dot("err", "hors ligne — conservé sur ce téléphone"); }
  }
}
function envoyer(k){ if (!SYNC.url) return dot("", "local"); S.pending[k] = 1; save(); dot("wait", "à envoyer…"); clearTimeout(envoyer.t); envoyer.t = setTimeout(vider, 2500); }
async function vider(){
  if (!SYNC.url || navigator.onLine === false) return;
  await envoyerFx(); await envoyerFo(); await envoyerRm(); await envoyerNs();
  for (const k of Object.keys(S.pending)){
    const x = cle(k), c = S.counts[k] || {f: {}, vrac: 0, zero: false};
    try {
      await appel("ecrire", {cle: k, date: x.d, zone: x.z, produit_id: x.id, produit: x.p?.n, code: x.p?.c, formats: JSON.stringify({...(c.f || {}), _z: c.zero ? 1 : 0, _s: c.s || {}}), vrac: Number(c.vrac) || 0,
        total: total(c, x.p) || 0, unite: UN[x.p?.b], lot: c.lot || "", dlc: c.dlc || "", compte_par: c.who || S.who, maj: new Date(c.t || Date.now()).toISOString()});
      delete S.pending[k]; save();
    } catch (e) { return dot("err", "hors ligne — conservé sur ce téléphone"); }
  }
  dot("ok", "synchronisé");
}
async function pull(){
  if (!SYNC.url) return dot("", "local");
  try {
    const r = await appel("lire", {date: S.date}); let n = 0;
    for (const row of r.rows || []){
      if (row.cle.startsWith("NS|")){ const id = Number(row.cle.slice(3)); if (!S.nsPending[id] && PID[id]){ try { S.ns[id] = JSON.parse(row.formats || "{}").ns === 1 ? 1 : 0; n++; } catch (e) {} } continue; }
      if (row.cle.startsWith("RM|")){ const id = Number(row.cle.slice(3)); if (!S.rmPending[id] && PID[id]){ try { const v = JSON.parse(row.formats || "{}").rm || []; if (v.length) S.rm[id] = v; else delete S.rm[id]; n++; } catch (e) {} } continue; }
      if (row.cle.startsWith("FO|")){ const id = Number(row.cle.slice(3)); if (!S.foPending[id] && PID[id]){ try { const v = JSON.parse(row.formats || "{}").fo; if (v) S.fo[id] = v; else delete S.fo[id]; n++; } catch (e) {} } continue; }
      if (row.cle.startsWith("FX|")){ const id = Number(row.cle.slice(3)); if (!S.fxPending[id] && PID[id]){ try { S.fx[id] = JSON.parse(row.formats || "[]"); n++; } catch (e) {} } continue; }
      const loc = S.counts[row.cle]; if (S.pending[row.cle] || (loc && (loc.t || 0) >= Date.parse(row.maj || 0))) continue;
      let f = {}; try { f = JSON.parse(row.formats || "{}"); } catch (e) {} const zz = !!f._z, ss = f._s || {}; delete f._z; delete f._s;
      S.counts[row.cle] = {f, s: ss, vrac: Number(row.vrac) || 0, lot: row.lot || "", dlc: row.dlc || "", who: row.compte_par, zero: zz, t: Date.parse(row.maj) || 0};
      const x = cle(row.cle); if (x.z && x.z !== "ATT" && !PID[x.id]?.z.includes(x.z)){ (S.extra[x.z] = S.extra[x.z] || []).includes(x.id) || S.extra[x.z].push(x.id); } n++;
    }
    save(); dot("ok", "synchronisé"); if (n) rendre();
  } catch (e) { dot("err", "hors ligne"); }
}
window.addEventListener("online", vider);
setInterval(() => { if (document.visibilityState === "visible") { vider(); pull(); } }, 30000);

document.addEventListener("click", e => { const i = e.target.closest(".ph-th"); if (i){ const id = Number(i.dataset.phk.slice(3)); Photos.voir(i.dataset.phk, PID[id]?.n, S.who); } });
Photos.init(() => { if (document.activeElement?.tagName !== "INPUT" && !document.querySelector("dialog[open]")) rendre(); });
majWho(); rendre(); pull(); vider();
if (!S.who) setTimeout(() => $("#who").click(), 300);
</script>
