<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventaire — Maison Savary</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
<link rel="apple-touch-icon" href="brand/favicon-256.png">
<style>
:root{--ink:#12211d;--ink-2:#3d4a45;--paper:#e6e8e1;--line:#ccd1c6;--accent:#0f6b57}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper)}
body{display:flex;flex-direction:column;font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif}
nav{display:flex;gap:8px;background:var(--paper);padding:calc(env(safe-area-inset-top) + 8px) 10px 0;border-bottom:3px solid var(--ink)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:8px 6px;border:2px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:#fff;color:var(--ink-2);cursor:pointer;font:inherit}
nav button img{height:20px;width:auto;display:block}
nav button b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:21px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
nav button small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.8}
nav button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff;transform:translateY(3px);padding-bottom:11px}
nav button[aria-selected=true] img{filter:invert(1) brightness(2)}
nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
iframe{flex:1;width:100%;border:0;background:var(--paper)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" id="b-conso" aria-selected="true"><img src="brand/logo-noir.png" alt="Savary"><b>Consommables</b></button>
  <button role="tab" id="b-mp" aria-selected="false"><small>Inventaire</small><b>Matières premières</b></button>
</nav>
<iframe id="f-conso" title="Inventaire des consommables" src="consommables.html"></iframe>
<iframe id="f-mp" title="Inventaire des matières premières" hidden></iframe>
<script>
const T = {conso: {b: document.getElementById("b-conso"), f: document.getElementById("f-conso"), src: "consommables.html"},
           mp:    {b: document.getElementById("b-mp"),    f: document.getElementById("f-mp"),    src: "matieres-premieres.html"}};
function montrer(k){
  for (const x in T){ const on = x === k; T[x].b.setAttribute("aria-selected", on); T[x].f.hidden = !on;
    if (on && !T[x].f.getAttribute("src")) T[x].f.setAttribute("src", T[x].src); }
  try { localStorage.setItem("onglet", k); } catch (e) {}
  history.replaceState(null, "", "#" + k);
}
T.conso.b.onclick = () => montrer("conso"); T.mp.b.onclick = () => montrer("mp");
let k = location.hash.slice(1); if (!T[k]) { try { k = localStorage.getItem("onglet"); } catch (e) {} }
montrer(T[k] ? k : "conso");
</script>
</body>
</html>
