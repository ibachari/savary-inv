<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saisie inventaire — Maison Savary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12211d; --ink-2:#3d4a45; --paper:#e6e8e1; --card:#fff;
  --line:#ccd1c6; --line-2:#e2e5dc;
  --accent:#0f6b57; --accent-soft:#d9ebe4; --accent-mid:#8fc3b2;
  --signal:#b8690f; --signal-soft:#f7ecdc;
  --zero:#78837c; --r:6px; --pad:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:100px}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--pad)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

.stickyhead{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px var(--pad);max-width:860px;margin:0 auto;flex-wrap:wrap}
.mark{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;line-height:1;padding-right:12px;border-right:1px solid var(--line)}
.mark span{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--ink-2);font-weight:600}
.field{display:flex;align-items:center;gap:8px}
.field label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-family:"IBM Plex Mono",monospace;font-size:14px;min-height:38px}
select{min-height:38px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:7px 8px;font-size:13px}

/* ---------- plan ---------- */
.plan{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow:hidden}
.levels{display:flex;gap:0;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.levels button{border:0;background:none;padding:11px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;border-bottom:2.5px solid transparent;color:var(--ink-2)}
.levels button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.levels .sync{margin-left:auto;padding:0 12px;display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);white-space:nowrap;border:0;background:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--accent)}.dot.wait{background:var(--signal)}.dot.err{background:#b3261e}
svg.map{display:block;width:100%;height:auto;background:#f7f8f4}
.zone rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:fill .2s}
.zone{cursor:pointer}
.zone .zc{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.zone .zn{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--ink-2);text-anchor:middle}
.zone.todo rect{stroke-dasharray:4 3;stroke:var(--signal)}
.zone.part rect{fill:var(--accent-soft)}
.zone.full rect{fill:var(--accent);stroke:var(--accent)}
.zone.full .zc,.zone.full .zn{fill:#fff}
.zone.off rect{fill:#eeefe9;stroke:var(--line-2)}
.zone.off .zc,.zone.off .zn{fill:#a6ada7}
.zone.off{cursor:default}
.zone.sel rect{stroke:var(--ink);stroke-width:3.5;stroke-dasharray:none}
.zone:hover:not(.off) rect{stroke:var(--ink)}
.zone rect.plain{fill:none!important}
.zone text.ink{fill:var(--ink)!important}
.zone rect.shelf{stroke:var(--line)!important;stroke-width:1!important;stroke-dasharray:none!important}
.struct{fill:#e0e2da;stroke:var(--line-2);stroke-width:1}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:8.5px;fill:var(--ink-2);text-anchor:middle;letter-spacing:.06em}
.lbl.sm{font-size:7.5px;fill:#8b948d}
.wallline{stroke:var(--ink);stroke-width:2;fill:none}
.plan-foot{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line-2);font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);flex-wrap:wrap}
.key{display:flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--line);flex:none}
.sw.todo{border-style:dashed;border-color:var(--signal)}
.sw.part{background:var(--accent-soft)}
.sw.full{background:var(--accent);border-color:var(--accent)}
.plan-foot .off-plan{margin-left:auto;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:5px 10px;font-family:inherit;font-size:10.5px}
.plan-foot .off-plan[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- plaque ---------- */
.plate{position:relative;background:var(--ink);color:#fff;border-radius:8px;margin:0 0 14px;padding:14px 18px}
.plate::before,.plate::after{content:"";position:absolute;top:13px;width:9px;height:9px;border-radius:50%;background:var(--paper);opacity:.3}
.plate::before{left:14px}.plate::after{right:14px}
.plate .code{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:clamp(46px,14vw,70px);line-height:.86;margin:2px 0 0}
.plate .lib{font-size:13px;color:#b9c8c2;margin-top:6px}
.plate .lvl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7f9990}
.gauge{margin-top:12px;height:8px;border-radius:99px;background:#2b3b36;overflow:hidden}
.gauge div{height:100%;background:var(--accent);width:0;transition:width .35s ease}
.plate .tally{display:flex;justify-content:space-between;margin-top:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#b9c8c2}
.plate .tally b{color:#fff;font-weight:600}

.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1 1 190px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-height:42px}
.search input{border:0;background:none;width:100%;padding:10px 0;min-width:0}
.search input:focus{outline:none}
.toggle{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:0 14px;min-height:42px;font-size:13px;font-weight:500}
.toggle[aria-pressed=true]{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}

.list{display:flex;flex-direction:column;gap:7px}
.row{background:var(--card);border:1px solid var(--line-2);border-left:3px solid var(--signal);border-radius:var(--r);padding:11px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.counted{border-left-color:var(--accent)}
.row.zeroed{border-left-color:var(--zero)}
.row .id{flex:1 1 180px;min-width:0}
.row .name{font-weight:600;line-height:1.3}
.row .meta{font-size:11.5px;color:var(--ink-2);margin-top:3px;font-family:"IBM Plex Mono",monospace}
.row .meta em{font-style:normal;color:var(--signal)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);font-size:22px;line-height:1;font-family:"Barlow Condensed",sans-serif;display:grid;place-items:center}
.stepper button:active{background:var(--ink);color:#fff}
.qty{width:74px;height:44px;text-align:center;border:1.5px solid var(--line);border-radius:var(--r);font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;background:var(--card)}
.qty:focus{border-color:var(--accent);outline:none;background:var(--accent-soft)}
.zero{height:44px;padding:0 11px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);font-family:"IBM Plex Mono",monospace;font-size:12px}
.row.zeroed .zero{background:var(--ink);border-color:var(--ink);color:#fff}
.total{flex:0 0 100%;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:7px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.total b{color:var(--ink);font-weight:600}
.total .add{border:0;background:none;color:var(--accent);font-size:12px;font-family:"IBM Plex Mono",monospace;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.loose{width:64px;height:32px;text-align:center;border:1px solid var(--line);border-radius:4px;font-family:"IBM Plex Mono",monospace;font-size:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink-2);font-size:14px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:#fff;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom))}
.bottom-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;position:relative}
.bottom .stat{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:#9fb3ab;line-height:1.35}
.bottom .stat b{display:block;color:#fff;font-size:14px;font-weight:600}
.act{border:1px solid #35463f;background:#1b2c27;color:#fff;border-radius:var(--r);min-height:44px;padding:0 14px;font-size:13px;font-weight:500;white-space:nowrap}
.act.primary{background:var(--accent);border-color:var(--accent)}
.menu{position:absolute;right:0;bottom:52px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:240px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:5px;font-size:14px}
.menu button:hover{background:var(--paper)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 2px}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:min(480px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(18,33,29,.55)}
.dlg{padding:18px}
.dlg h2{font-family:"Barlow Condensed",sans-serif;font-size:24px;margin:0 0 4px;letter-spacing:.02em}
.dlg p{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.dlg label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:12px 0 5px}
.dlg input[type=text],.dlg input[type=url]{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:10px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.dlg .cb{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13.5px}
.dlg .cb input{width:20px;height:20px}
.dlg .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg .actions button{min-height:42px;padding:0 15px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);font-size:13.5px}
.dlg .actions .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.dlg .status{font-family:"IBM Plex Mono",monospace;font-size:11.5px;margin-top:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:82px;background:var(--ink);color:#fff;border:1px solid #35463f;border-radius:var(--r);padding:10px 16px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:11.5px;color:var(--ink-2);margin:18px 0 4px;font-family:"IBM Plex Mono",monospace}
.foot button{border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:11.5px;font-family:inherit;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.stickyhead,.bottom,.tools,.foot,.levels{display:none}.row{break-inside:avoid}}
</style>
</head>
<body>

<div class="stickyhead"><div class="top-in">
  <div class="mark">Inventaire<span>Maison Savary</span></div>
  <div class="field"><label for="d">Date</label><input type="date" id="d"></div>
  <div class="field" style="margin-left:auto"><label for="svc">Service</label><select id="svc"></select></div>
</div></div>

<main class="wrap">
  <section class="plan">
    <div class="levels" id="levels"></div>
    <div id="map"></div>
    <div class="plan-foot">
      <span class="key"><i class="sw todo"></i>à compter</span>
      <span class="key"><i class="sw part"></i>en cours</span>
      <span class="key"><i class="sw full"></i>terminé</span>
      <button class="off-plan" id="autres" aria-pressed="false">Hors plan · Autres</button>
    </div>
  </section>

  <section class="plate">
    <div class="lvl" id="p-lvl">—</div>
    <h1 class="code" id="p-code">A</h1>
    <div class="lib" id="p-lib">—</div>
    <div class="gauge"><div id="p-bar"></div></div>
    <div class="tally"><span id="p-count">0 / 0</span><span id="p-units">0 unités</span></div>
  </section>

  <div class="tools">
    <div class="search"><span aria-hidden="true" style="opacity:.45">⌕</span><input id="q" type="search" placeholder="Chercher un produit…" autocomplete="off"></div>
    <button class="toggle" id="only" aria-pressed="false">Reste à compter</button>
  </div>

  <div class="list" id="list"></div>
  <p class="foot">Saisie enregistrée automatiquement par date. <button id="reset">Vider le comptage du jour</button></p>
</main>

<div class="bottom"><div class="bottom-in">
  <div class="stat"><b id="b-main">0 / 109 produits comptés</b><span id="b-sub">—</span></div>
  <button class="act" id="more">Exporter ▾</button>
  <button class="act primary" id="push">Envoyer</button>
  <div class="menu" id="menu">
    <button data-m="copy">Copier pour Google Sheets</button>
    <button data-m="csv">Télécharger le CSV</button>
    <hr>
    <button data-m="cfg">Connexion Google Sheets…</button>
  </div>
</div></div>

<dialog id="cfg"><div class="dlg">
  <h2>Connexion Google Sheets</h2>
  <p>Colle l'adresse du script publié depuis le classeur d'inventaire (Extensions → Apps Script → Déployer → Application web).</p>
  <label for="c-url">URL du script</label>
  <input type="url" id="c-url" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="c-tok">Clé partagée</label>
  <input type="text" id="c-tok" placeholder="la même que dans le script">
  <div class="cb"><input type="checkbox" id="c-auto"><label for="c-auto" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:400;color:var(--ink)">Envoyer automatiquement pendant le comptage</label></div>
  <div class="status" id="c-status"></div>
  <div class="actions">
    <button class="go" id="c-save">Enregistrer</button>
    <button id="c-test">Tester l'envoi</button>
    <button id="c-close">Fermer</button>
  </div>
</div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  },
  async set(k, v){
    if (typeof window.storage !== "undefined" && window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
  }

const rec = id => state[id] || {};

function progress(code){
  const z = SEC[code];
  if (!z) return {done:0, tot:0, pct:0, state:"off"};

  return {done, tot, pct: tot ? done/tot : 0, state: done === tot ? "full" : (done ? "part" : "todo")};

    <rect x="8" y="8" width="324" height="234" fill="none" class="wallline" rx="4"/>
    <g class="zone ${g.state}${sector==="E"?" sel":""}" data-z="E" tabindex="0" role="button" aria-label="Secteur E">
      <rect class="plain" x="16" y="16" width="308" height="218" rx="4"/>
      <text class="zc ink" x="170" y="28" style="font-size:15px">E · réserve</text>
      <text class="zn ink" x="170" y="42">${g.done}/${g.tot} comptés</text>
    </g>
    <rect x="146" y="50" width="48" height="9" class="struct"/><text class="lbl sm" x="170" y="68">ARRIVÉE DU RDC</text>
    ${rack(1,26,80)}${rack(3,26,110)}
    <rect x="26" y="142" width="46" height="26" class="struct"/><text class="lbl sm" x="49" y="158">ESCALIER</text>
    ${rack(5,26,176)}${rack(7,90,176)}${rack(9,154,176)}
    ${rack(2,246,80)}${rack(4,246,110)}
    <rect x="290" y="150" width="34" height="9" class="struct"/><text class="lbl sm" x="272" y="146">2ᵉ arrivée</text>
    <text class="lbl sm" x="62" y="76">impairs · gauche</text>
    <text class="lbl sm" x="269" y="76">pairs · droite</text>
    <text class="lbl sm" x="170" y="228">1 numéro = 1 rack de 3 palettes</text>
  </svg>`;
}
function planF(){
  const g = progress("F");
  const fill = g.state==="full" ? "var(--accent)" : (g.state==="part" ? "var(--accent-soft)" : "var(--card)");
  let shelves = "";
  for (let i = 0; i < 12; i++){
    shelves += `<rect class="shelf" x="30" y="${46 + i*14}" width="72" height="11"/>`;
    shelves += `<rect class="shelf" x="238" y="${46 + i*14}" width="72" height="11"/>`;
  }
  return `<svg class="map" viewBox="0 0 340 250" role="group" aria-label="Plan salle hygiène">
    <rect x="8" y="8" width="324" height="234" fill="none" class="wallline" rx="4"/>
    <g class="zone ${g.state}${sector==="F"?" sel":""}" data-z="F" tabindex="0" role="button" aria-label="Secteur F">
      <rect class="plain" x="16" y="16" width="308" height="218" rx="4"/>
      ${shelves}
      <text class="zc ink" x="170" y="120" style="font-size:34px">F</text>
      <text class="zn ink" x="170" y="142">${g.done}/${g.tot} comptés</text>
    </g>
    <rect x="112" y="40" width="116" height="180" rx="3" style="fill:none;stroke:var(--line-2)" stroke-dasharray="3 3"/>
    <text class="lbl sm" x="170" y="166">allée centrale</text>
    <text class="lbl sm" x="66" y="36">F-01 → F-12</text>
    <text class="lbl sm" x="274" y="36">F-13 → F-24</text>
    <rect x="146" y="234" width="48" height="8" class="struct"/><text class="lbl" x="170" y="230">ENTRÉE</text>
  </svg>`;
}
function renderPlan(){
  $("#levels").innerHTML = LEVELS.map(l => {
    const tot = l.zones.reduce((s,c) => s + progress(c).tot, 0);
    const done = l.zones.reduce((s,c) => s + progress(c).done, 0);
    return `<button data-l="${l.id}" aria-pressed="${l.id===level}">${l.label}<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-2)"> ${done}/${tot}</span></button>`;
  }).join("") + `<button class="sync" id="syncbtn" title="État de la synchronisation"><i class="dot ${sync.status==="ok"?"ok":sync.status==="wait"?"wait":sync.status==="err"?"err":""}"></i>${syncLabel()}</button>`;
  const L = LEVELS.find(l => l.id === level);
  $("#map").innerHTML = level === "E" ? planReserve() : level === "F" ? planF() : planRDC(L.zones);
}
function syncLabel(){
  if (!cfg.url) return "Sheets non relié";
  if (sync.status === "wait") return "envoi…";
  if (sync.status === "err") return "échec envoi";
  if (sync.status === "ok") return "envoyé " + sync.at;
  return "Sheets relié";
}

/* ---------- rendu liste ---------- */
function renderServices(){
  const el = $("#svc");
  if (el.options.length) return;
  el.innerHTML = `<option value="">Tous</option>` + [...new Set(PRODUCTS.map(p => p.s))].sort().map(s => `<option>${s}</option>`).join("");
}
function visible(){
  let items = (SEC[sector] || {items:[]}).items;
  if (service) items = items.filter(p => p.s === service);
  if (onlyTodo) items = items.filter(p => !isCounted(p.id));
  if (query){ const q = query.toLowerCase(); items = items.filter(p => p.n.toLowerCase().includes(q)); }
  return items;
}
function render(){
  const z = SEC[sector];
  const g = progress(sector);
  $("#p-code").textContent = z.c;
  $("#p-lib").textContent = z.l;
  $("#p-lvl").textContent = "Niveau " + z.n + " · " + g.tot + " références";
  $("#p-bar").style.width = (g.pct*100) + "%";
  $("#p-count").textContent = g.done + " / " + g.tot + " comptés";
  $("#p-units").textContent = nf(z.items.reduce((s,p) => s + totalUnits(p), 0)) + " unités";

  const items = visible();
  $("#list").innerHTML = items.length ? items.map(p => {
    const r = rec(p.id), t = totalUnits(p);
    const cls = r.z ? "zeroed" : (isCounted(p.id) ? "counted" : "");
    const alt = [p.z1, p.z2].filter(x => x && x !== sector)[0];
    return `<article class="row ${cls}" data-id="${p.id}">
      <div class="id"><div class="name">${p.n}</div>
        <div class="meta">${p.s} · ${nf(p.u)} u./colis${alt ? ` · <em>aussi ${alt}</em>` : ""}</div></div>
      <div class="stepper">
        <button data-act="dec" aria-label="Retirer un colis">−</button>
        <input class="qty" inputmode="numeric" pattern="[0-9]*" value="${r.c ?? ""}" placeholder="—" aria-label="Nombre de colis — ${p.n}">
        <button data-act="inc" aria-label="Ajouter un colis">+</button>
      </div>
      <button class="zero" data-act="zero">0</button>
      <div class="total">
        <span>${(r.c || r.l) ? `<b>${nf(t)}</b> unités` : (r.z ? "<b>Stock nul</b>" : "en attente de comptage")}</span>
        ${r.l != null ? `<span>+ <input class="loose" inputmode="numeric" value="${r.l}" aria-label="Unités hors colis"> u. hors colis</span>`
                      : `<button class="add" data-act="loose">+ unités hors colis</button>`}
      </div></article>`;
  }).join("") : `<p class="empty">${onlyTodo ? "Tout est compté dans ce secteur." : "Aucun produit ne correspond."}</p>`;

  renderPlan();
  $("#autres").setAttribute("aria-pressed", sector === "Autres");
  const gd = PRODUCTS.filter(p => isCounted(p.id)).length;
  $("#b-main").textContent = gd + " / " + PRODUCTS.length + " produits comptés";
  $("#b-sub").textContent = "inventaire du " + frDate() + (sync.msg ? " · " + sync.msg : "");
}

/* ---------- saisie ---------- */
function set(id, patch){
  state[id] = {...rec(id), ...patch};
  const r = state[id];
  if (!r.c && !r.l && !r.z) delete state[id];
  save();
}
$("#list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const id = btn.closest(".row").dataset.id, act = btn.dataset.act;
  if (act === "inc") set(id, {c:(Number(rec(id).c)||0)+1, z:false});
  if (act === "dec") set(id, {c:Math.max(0,(Number(rec(id).c)||0)-1) || undefined, z:false});
  if (act === "zero") set(id, {z:!rec(id).z, c:undefined, l:undefined});
  if (act === "loose") set(id, {l:0});
  render();
});
$("#list").addEventListener("input", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id, v = e.target.value.replace(/[^0-9]/g,"");
  e.target.value = v;
  if (e.target.classList.contains("qty")) state[id] = {...rec(id), c: v === "" ? undefined : Number(v), z:false};
  if (e.target.classList.contains("loose")) state[id] = {...rec(id), l: v === "" ? 0 : Number(v)};
  const p = PRODUCTS.find(x => x.id == id), r = state[id];
  row.querySelector(".total span").innerHTML = (r.c || r.l) ? `<b>${nf(totalUnits(p))}</b> unités` : "en attente de comptage";
  row.className = "row " + (isCounted(id) ? "counted" : "");
  save();
});
$("#list").addEventListener("change", render);

/* ---------- navigation plan ---------- */
$("#levels").addEventListener("click", e => {
  const b = e.target.closest("button[data-l]");
  if (b){ level = b.dataset.l; renderPlan(); return; }
  if (e.target.closest("#syncbtn")) openCfg();
});
$("#map").addEventListener("click", e => selectZone(e.target.closest(".zone")));
$("#map").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); selectZone(e.target.closest(".zone")); }
});
function selectZone(g){
  if (!g || g.classList.contains("off")) return;
  const code = g.dataset.z;
  if (!SEC[code]) return;
  sector = code;
  if (code === "E") level = "E";
  render();
  $(".plate").scrollIntoView({behavior:"smooth", block:"start"});
}
$("#autres").addEventListener("click", () => { if (SEC["Autres"]){ sector = "Autres"; render(); $(".plate").scrollIntoView({behavior:"smooth"}); } });
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#svc").addEventListener("change", e => { service = e.target.value; render(); });
$("#only").addEventListener("click", e => { onlyTodo = !onlyTodo; e.currentTarget.setAttribute("aria-pressed", onlyTodo); render(); });
dateEl.addEventListener("change", load);
$("#reset").addEventListener("click", () => {
  if (!confirm("Vider tout le comptage du " + frDate() + " ?")) return;
  state = {}; save(); render(); toast("Comptage vidé");
});

/* ---------- lignes exportées ---------- */
const HEAD = ["Date","Secteur","Produit / Référence","Service","Unités par colis","Nombre de colis","Unités hors colis","Quantité totale"];

function rows(){
  return PRODUCTS.filter(p => isCounted(p.id)).map(p => {
    const r = rec(p.id);
    return [
      dateEl.value,
      p.z1 || "Autres",
      p.n,
      p.s,
      p.u,
      Number(r.c) || 0,
      Number(r.l) || 0,
      totalUnits(p)
    ];
  });
}

/* ---------- menu export ---------- */
$("#more").addEventListener("click", e => { e.stopPropagation(); $("#menu").classList.toggle("on"); });
document.addEventListener("click", () => $("#menu").classList.remove("on"));
$("#menu").addEventListener("click", e => {
  const m = e.target.closest("button")?.dataset.m; if (!m) return;
  $("#menu").classList.remove("on");
  if (m === "cfg") return openCfg();
  const r = rows();
  if (!r.length) return toast("Rien à exporter pour l'instant");
  if (m === "csv"){
    const csv = "\uFEFF" + [HEAD, ...r].map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    a.download = "inventaire_" + dateEl.value + ".csv"; a.click();
    toast(r.length + " lignes exportées");
  }
  if (m === "copy"){
    navigator.clipboard.writeText([HEAD, ...r].map(l => l.join("\t")).join("\n"))
      .then(() => toast("Copié — collez dans Google Sheets"))
      .catch(() => toast("Copie refusée, utilisez le CSV"));
  }
});

/* ---------- synchro Google Sheets ---------- */
let pushTimer = null;
function queuePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(() => push(true), 2500); }
async function push(silent){
  if (!cfg.url) { if (!silent) openCfg(); return; }
  const r = rows();
  if (!r.length){ if (!silent) toast("Rien à envoyer pour l'instant"); return; }
  sync.status = "wait"; renderPlan();
  const payload = {token: cfg.token, date: dateEl.value, entetes: HEAD, lignes: r};
  try {
    const res = await fetch(cfg.url, {
      method: "POST", redirect: "follow",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "refus du script");
    sync.status = "ok";
    sync.at = new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    sync.msg = data.majSaisie + " lignes dans Saisie";
    if (!silent) toast(r.length + " lignes envoyées dans le classeur");
  } catch (err) {
    sync.status = "err"; sync.msg = "envoi impossible";
    if (!silent) toast("Envoi impossible : " + err.message + ". Vérifiez l'URL et le déploiement.");
  }
  render();
}
$("#push").addEventListener("click", () => push(false));

function openCfg(){ $("#c-status").textContent = cfg.url ? "Relié. " + syncLabel() : "Pas encore relié."; $("#cfg").showModal(); }
$("#c-close").addEventListener("click", () => $("#cfg").close());
$("#c-save").addEventListener("click", async () => {
  cfg = {url: $("#c-url").value.trim(), token: $("#c-tok").value.trim(), auto: $("#c-auto").checked};
  try { await store.set("cfg:gsheet", JSON.stringify(cfg)); } catch(e){}
  $("#cfg").close(); renderPlan(); toast("Connexion enregistrée");
});
$("#c-test").addEventListener("click", async () => {
  cfg = {url: $("#c-url").value.trim(), token: $("#c-tok").value.trim(), auto: $("#c-auto").checked};
  $("#c-status").textContent = "Envoi en cours…";
  await push(true);
  $("#c-status").textContent = sync.status === "ok" ? "Réussi : " + sync.msg : "Échec — vérifiez l'URL, la clé et l'accès « Tout le monde ».";
});

renderServices();
loadCfg();
load();
</script>
</body>
